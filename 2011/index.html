<!DOCTYPE html>
<html>
	<head>
		<title>Candy Crush</title>
		<meta charset=utf-8 />
		<script src="../js/Page.js" type="text/javascript"></script>
		<link rel=stylesheet href="../css/style.css" />
		<style id=pageStyle>body { font-family: Tahoma; } dl dd li { font-size: 8pt; }</style>
	</head>

	<body bgcolor="#ffffff">
		<table>
			<tr>
				<td>
					<div id=gameContainer style="height: 600px;">
						<object classid="clsid:d27cdb6e-ae6d-11cf-96b8-444553540000" codebase="https://fpdownload.macromedia.com/pub/shockwave/cabs/flash/swflash.cab#version=8,0,0,0" width=755px height=600px id=candysaga>
							<param name=allowScriptAccess value=sameDomain />
							<param name=movie value="CandyCrush.swf" />
							<param name=quality value=best />
							<param name=wmode value=direct />
							<embed src="CandyCrush.swf" quality=best width=755px height=600px name=candysaga wmode=direct allowscriptaccess=sameDomain type="application/x-shockwave-flash" pluginspage="https://www.macromedia.com/go/getflashplayer" />
						</object>
					</div>
				</td>
				
				<td>
					<dl>
						<dt id=tasksCard>Game Tools</dt>
						<dd>
							<li><a href="?" onclick="history.go(0); return false;">Refresh</a></li>
						</dd>
					</dl>
					
					<dl>
						<dt id=versionCard>Select Version</dt>
						<dd>
							<li><b>Candy Crush</b></li>
							<li><a href="/2012/">Candy Crush Saga 2012</a></li>
							<li><a href="/2013/">Candy Crush Saga 2013</a></li>
							<li><a href="/">Candy Crush Saga 2017</a></li>
						</dd>
					</dl>
					
					<dl>
						<dt id=themeCard>Select Theme</dt>
						<dd id=themeList>
							<li><a class=theme-select onclick="setTheme('auto');" data-theme=auto>Auto</a></li>
							<li><a class=theme-select onclick="setTheme('default');" data-theme=default>Default</a></li>
							<li><a class=theme-select onclick="setTheme('classic');" data-theme=classic>Classic</a></li>
							<li><a class=theme-select onclick="setTheme('halloween');" data-theme=halloween>Halloween</a></li>
							<li><a class=theme-select onclick="setTheme('halloween-2015');" data-theme=halloween-2015>Halloween 2015</a></li>
							<li><a class=theme-select onclick="setTheme('xmas');" data-theme=xmas>Christmas</a></li>
						</dd>
					</dl>
				</td>
			</tr>
		</table>
		
		<script>initCards(); initBackground();</script>
	</body>
</html>
